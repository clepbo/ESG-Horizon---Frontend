name: Frontend CI/CD

on:
  push:
    branches: [main, staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          # Build optimizations
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package.json') }}-

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/main" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-prod" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-staging" >> $GITHUB_ENV
            echo "PORT=3002" >> $GITHUB_ENV
          fi

      - name: Transfer Standalone Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          source: ".next/standalone,.next/static,public,ecosystem.config.js,package.json"
          target: ${{ env.TARGET_DIR }}
          strip_components: 0 # Keep full structure

      - name: Start/Restart via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ${{ env.TARGET_DIR }}
            pm2 delete ${{ env.APP_NAME }} || true

            # 1. THE ESSENTIAL MOVE
            # Standalone output contains its own .next folder inside.
            # We must move everything from .next/standalone/ to the root.
            if [ -d ".next/standalone" ]; then
              # Copy essential server files and the internal .next folder
              cp -r .next/standalone/. .
            fi

            # 2. THE STATIC ASSETS MOVE
            # Next.js standalone does not include static or public files by default.
            # We must place them in the locations server.js expects.
            mkdir -p .next/static
            if [ -d ".next/static" ]; then
                # This ensures the global .next/static is populated
                :
            fi

            # 3. CLEANUP
            # We can remove the build-time standalone folder now that it's copied
            rm -rf .next/standalone

            # 4. INSTALL NATIVE MODULES
            # Standalone mode skips some native modules like 'sharp'
            npm install --omit=dev --no-package-lock

            # 5. VERIFY AND START
            if [ ! -f "server.js" ]; then
              echo "ERROR: server.js not found in $(pwd)"
              exit 1
            fi

            mkdir -p logs
            PORT=${{ env.PORT }} NODE_ENV=production pm2 start server.js --name "${{ env.APP_NAME }}"
            pm2 save
