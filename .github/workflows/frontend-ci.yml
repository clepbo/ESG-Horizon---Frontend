name: Frontend CI/CD

on:
  push:
    branches: [main, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/main" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-prod" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-staging" >> $GITHUB_ENV
            echo "PORT=3002" >> $GITHUB_ENV
          fi

      - name: Transfer Standalone Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          # This pulls the contents of standalone and the static folders
          source: ".next/standalone,.next/static,public"
          target: ${{ env.TARGET_DIR }}
          strip_components: 2 

      - name: Start/Restart via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Load Node/PM2 environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd ${{ env.TARGET_DIR }}
            
            # 2. Cleanup old internal folders if they exist to prevent nesting errors
            rm -rf .next/static
            
            # 3. Create the structure Next.js expects:
            # Standalone server needs 'static' files inside '.next/static'
            mkdir -p .next/static
            
            # Move the transferred chunks/css into the new static folder
            # We use '|| true' so the script doesn't crash if a folder is missing
            mv -f chunks .next/static/ || true
            mv -f css .next/static/ || true
            
            # 4. Final Start
            # server.js is in the root of TARGET_DIR because of strip_components: 2
            pm2 delete ${{ env.APP_NAME }} || true
            PORT=${{ env.PORT }} pm2 start server.js --name "${{ env.APP_NAME }}"
            pm2 save