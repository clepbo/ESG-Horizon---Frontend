name: Frontend CI/CD

on:
  push:
    branches: [main, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/main" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-prod" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-staging" >> $GITHUB_ENV
            echo "PORT=3002" >> $GITHUB_ENV
          fi

      - name: Transfer Standalone Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          # We transfer the folders exactly as they are built
          source: ".next/standalone,.next/static,public"
          target: ${{ env.TARGET_DIR }}
          strip_components: 2

      - name: Start/Restart via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Load Node/PM2 Environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd ${{ env.TARGET_DIR }}
            
            # 2. Fix the structure for the Standalone server
            # Move static files into the hidden .next folder where server.js looks
            mkdir -p .next/static
            # If scp dropped 'chunks' and 'css' in the root, move them
            mv -f chunks .next/static/ || true
            mv -f css .next/static/ || true
            # If scp dropped a 'static' folder, move its contents
            mv -f static/* .next/static/ || true
            
            # 3. Clean up the root (Optional but keeps it tidy like your ls)
            # Remove the empty standalone folder if it exists
            rm -rf standalone || true

            # 4. Final Start
            pm2 delete ${{ env.APP_NAME }} || true
            PORT=${{ env.PORT }} pm2 start server.js --name "${{ env.APP_NAME }}"
            pm2 save