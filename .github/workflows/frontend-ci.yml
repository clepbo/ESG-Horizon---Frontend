name: Frontend CI/CD

on:
  push:
    branches: [main, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/main" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-prod" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-staging" >> $GITHUB_ENV
            echo "PORT=3002" >> $GITHUB_ENV
          fi

      - name: Transfer Standalone Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          # We transfer the folders but we will handle the "move" manually for total control
          source: ".next/standalone,.next/static,public"
          target: ${{ env.TARGET_DIR }}
          strip_components: 1 # Change this to 1 to keep 'standalone' and 'public' as folders

      - name: Start/Restart via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /var/www/esghorizon/main

            # Ensure public directory exists and assets are moved there
            mkdir -p public
            mv -f images icons avatar.jpg favicon.ico logo.PNG public/ 2>/dev/null || true

            # Organize Next.js structure
            if [ -d "standalone" ]; then
              cp -r standalone/. .
              rm -rf standalone
            fi

            mkdir -p .next/static
            mv -f chunks css .next/static/ 2>/dev/null || true
            if [ -d "static" ]; then
              cp -r static/. .next/static/
              rm -rf static
            fi

            pm2 delete esg-frontend-prod || true
            PORT=3001 pm2 start server.js --name "esg-frontend-prod"
            pm2 save