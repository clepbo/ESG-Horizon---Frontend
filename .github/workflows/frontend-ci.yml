name: Frontend CI/CD

on:
  push:
    branches: [main, staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          # Build optimizations
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/main" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-prod" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-staging" >> $GITHUB_ENV
            echo "PORT=3002" >> $GITHUB_ENV
          fi

      - name: Transfer Standalone Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          source: ".next/standalone,.next/static,public,ecosystem.config.js,package.json"
          target: ${{ env.TARGET_DIR }}
          strip_components: 0 # Keep full structure

      - name: Start/Restart via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd ${{ env.TARGET_DIR }}
            pm2 delete ${{ env.APP_NAME }} || true

            # 1. Organize Standalone
            if [ -d ".next/standalone" ]; then
              cp -r .next/standalone/* .
              mkdir -p temp_static
              cp -r .next/static/* temp_static/ 2>/dev/null || true
            fi

            # 2. Cleanup and Reconstruct
            rm -rf .next
            mkdir -p .next/static
            if [ -d "temp_static" ]; then
              mv temp_static/* .next/static/
              rm -rf temp_static
            fi

            # 3. FIX: Install Production Dependencies
            # This handles 'sharp' and native modules that standalone doesn't bundle
            npm install --omit=dev

            # 4. Verify and Start
            if [ ! -f "server.js" ]; then
              echo "ERROR: server.js not found!"
              exit 1
            fi

            mkdir -p logs
            PORT=${{ env.PORT }} pm2 start server.js --name "${{ env.APP_NAME }}" --env production
            pm2 save