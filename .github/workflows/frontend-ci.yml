name: Frontend CI/CD
on:
  push:
    branches: [main, staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/main" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-prod" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
            echo "API_URL=https://api.esghorizon.africa" >> $GITHUB_ENV
            echo "MARKETING_URL=https://esghorizon.africa" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-frontend-staging" >> $GITHUB_ENV
            echo "PORT=3002" >> $GITHUB_ENV
            echo "API_URL=https://staging-api.esghorizon.africa" >> $GITHUB_ENV
            echo "MARKETING_URL=https://staging-marketing.esghorizon.africa" >> $GITHUB_ENV
          fi

      - name: Build Next.js app
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_MARKETING_URL: ${{ env.MARKETING_URL }}
          NODE_ENV: production

      - name: Transfer Standalone Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".next/standalone,.next/static,public,ecosystem.config.js,package.json,.yarnrc.yml,.yarn"
          target: ${{ env.TARGET_DIR }}

      - name: Start/Restart via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ env.TARGET_DIR }}
            if [ -d ".next/standalone" ]; then cp -r .next/standalone/. .; fi
            rm -rf .next/standalone
            corepack enable
            yarn install
            pm2 delete ${{ env.APP_NAME }} || true
            PORT=${{ env.PORT }} NODE_ENV=production pm2 start server.js --name "${{ env.APP_NAME }}"
            pm2 save